<!DOCTYPE html>
<html lang="lo">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ແກ້ໄຂໝວດໝູ່ | 078food</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
      <style>
            body {
                  font-family: 'Noto Sans Lao', system-ui, sans-serif;
                  background: #f5f7fb;
                  padding: 24px;
                  color: #202938;
            }

            main {
                  max-width: 600px;
                  margin: 30px auto;
                  background: white;
                  padding: 24px;
                  border-radius: 12px;
            }

            input,
            textarea,
            button {
                  box-sizing: border-box;
                  width: 100%;
                  padding: 12px;
                  margin: 8px 0 16px;
                  font: inherit;
            }

            button {
                  background: #16834a;
                  color: white;
                  border: 0;
                  border-radius: 6px;
                  cursor: pointer;
            }

            .message {
                  padding: 10px;
                  background: #dcfce7;
                  color: #166534;
                  border-radius: 6px;
            }
            .message.error {
                  background: #ffebee;
                  color: #991b1b;
            }
      </style>
</head>

<body>
      <main>
            <p><a href="{{ url_for('admin_categories') }}">← ກັບໜ້າໝວດໝູ່</a></p>
            <h1>ແກ້ໄຂໝວດໝູ່ #{{ category.id }}</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category_type, message in messages %}
            <p class="message {{ category_type }}">{{ message }}</p>
            {% endfor %}
            {% endwith %}

            <form method="POST">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <label for="name">ຊື່ໝວດໝູ່ *</label>
                  <input id="name" name="name" required maxlength="100" value="{{ category.name }}">

                  <label for="description">ລາຍລະອຽດ</label>
                  <textarea id="description" name="description" rows="4">{{ category.description or "" }}</textarea>

                  <button type="submit">ບັນທຶກການແກ້ໄຂ</button>
            </form>
      </main>
</body>

</html>
