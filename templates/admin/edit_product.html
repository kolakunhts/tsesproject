<!DOCTYPE html>
<html lang="lo">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>ແກ້ໄຂອາຫານ | 078food</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
      <style>
            body {
                  font-family: 'Noto Sans Lao', system-ui, sans-serif;
                  background: #f5f7fb;
                  padding: 20px;
                  color: #202938;
            }

            main {
                  max-width: 650px;
                  margin: 25px auto;
                  padding: 24px;
                  background: white;
                  border-radius: 12px;
            }

            input,
            select,
            textarea,
            button {
                  box-sizing: border-box;
                  width: 100%;
                  padding: 11px;
                  margin: 8px 0 15px;
                  font: inherit;
            }

            button {
                  background: #16834a;
                  color: white;
                  border: 0;
                  border-radius: 6px;
                  cursor: pointer;
            }

            .message {
                  padding: 10px;
                  background: #dcfce7;
                  color: #166534;
                  border-radius: 6px;
            }
            .message.error {
                  background: #ffebee;
                  color: #991b1b;
            }
      </style>
</head>

<body>
      <main>
            <p><a href="{{ url_for('admin_products') }}">← ກັບລາຍການອາຫານ</a></p>
            <h1>ແກ້ໄຂອາຫານ #{{ product.id }}</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="message {{ category }}">{{ message }}</p>
            {% endfor %}
            {% endwith %}

            <form method="POST">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <label for="name">ຊື່ອາຫານ *</label>
                  <input id="name" name="name" required value="{{ product.name }}">

                  <label for="category_id">ໝວດໝູ່ *</label>
                  <select id="category_id" name="category_id" required>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id==product.category_id %}selected{% endif %}>
                              {{ category.name }}
                        </option>
                        {% endfor %}
                  </select>

                  <label for="description">ລາຍລະອຽດ</label>
                  <textarea id="description" name="description" rows="4">{{ product.description or "" }}</textarea>

                  <label for="price">ລາຄາ (ກີບ) *</label>
                  <input id="price" name="price" type="number" min="0" step="1" required value="{{ product.price }}">

                  <label for="stock">ຈຳນວນສະຕັອກ *</label>
                  <input id="stock" name="stock" type="number" min="0" step="1" required value="{{ product.stock }}">

                  <label for="image_url">URL ຮູບອາຫານ</label>
                  <input id="image_url" name="image_url" type="url" value="{{ product.image_url or '' }}">

                  <button type="submit">ບັນທຶກການແກ້ໄຂ</button>
            </form>
      </main>
</body>

</html>
