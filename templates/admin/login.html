
<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | 078food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #171923; color: #f7fafc;
      font-family: 'Noto Sans Lao', system-ui, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; padding: 30px;
      background: #242735; border: 1px solid #3b4052; border-radius: 18px;
    }
    h1 { color: #f6ad55; }
    label { display: block; margin: 16px 0 6px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #4a5064;
      border-radius: 8px; background: #171923; color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 22px; border: 0;
      border-radius: 8px; background: #dd6b20; color: white;
      font-size: 16px; cursor: pointer;
    }
    .message { padding: 10px; background: #4a2830; border-radius: 8px; }
    a { color: #f6ad55; }
  </style>
</head>
<body>
  <main>
    <h1>078food Admin</h1>
    <h2>Admin Login</h2>
    <p>ສຳລັບຜູ້ດູແລລະບົບເທົ່ານັ້ນ.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Admin Email ຫຼື Username</label>
      <input id="email" name="email" type="text" maxlength="254" required autocomplete="username"
             value="{{ request.form.get('email', '') }}">

      <label for="password">ລະຫັດຜ່ານ</label>
      <input id="password" name="password" type="password" maxlength="128"
             required autocomplete="current-password">

      <button type="submit">ເຂົ້າລະບົບ Admin</button>
    </form>

    <p><a href="{{ url_for('home') }}">← ກັບໜ້າຫຼັກ</a></p>
  </main>
</body>
</html>
