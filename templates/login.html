<!DOCTYPE html>
<html lang="lo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ເຂົ້າສູ່ລະບົບ | 078food</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Serif+Lao:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #FAF9F6;
      --card: #FFFFFF;
      --ink: #2B2523;
      --muted: #6F6663;
      --green: #2D5A27;
      --green-dark: #22461e;
      --green-light: rgba(45, 90, 39, 0.08);
      --line: #E6E2D8;
      --danger: #B3402A;
      --shadow: 0 4px 24px rgba(74, 62, 61, 0.08);
      --font: 'Noto Sans Lao', system-ui, -apple-system, sans-serif;
      --font-d: 'Noto Serif Lao', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.6;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-d);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 20px;
      text-decoration: none;
    }

    .brand i {
      font-style: normal;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 1.25rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: var(--font);
      background: #FAFAFA;
      color: var(--ink);
      transition: border-color .2s, box-shadow .2s;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--green);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.12);
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: grid;
      place-items: center;
      border-radius: 8px;
    }

    .pw-toggle:hover {
      color: var(--ink);
      background: rgba(0, 0, 0, 0.04);
    }

    .pw-toggle i {
      position: static;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 14px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      color: var(--ink);
    }

    .remember-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s;
    }

    .btn-submit:hover {
      background: var(--green-dark);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-footer a {
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted) !important;
      font-size: 0.85rem;
      font-weight: 500 !important;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }

    .alert-success {
      background: #DCFCE7;
      color: #166534;
      border: 1px solid #86EFAC;
    }

    .alert-warning {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FCD34D;
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <a href="{{ url_for('home') }}" class="brand">
      <i>🍲</i>078food
    </a>

    <h1>ເຂົ້າສູ່ລະບົບ</h1>
    <p class="subtitle">ໃຊ້ເບີໂທລະສັບ ຫຼື ອີເມວ ເພື່ອສັ່ງອາຫານ ແລະ ຕິດຕາມອໍເດີ</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ 'error' if category in ['error', 'danger'] else ('success' if category == 'success' else 'warning') }}">
        <i class="fa-solid fa-{{ 'circle-check' if category == 'success' else 'circle-exclamation' }}"></i>
        <span>{{ message }}</span>
      </div>
    {% endfor %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">ເບີໂທລະສັບ ຫຼື ອີເມວ</label>
        <div class="input-wrap">
          <i class="fa-solid fa-phone-volume" id="identifierIcon"></i>
          <input id="email" name="email" type="text" maxlength="254" required autocomplete="username"
                 value="{{ request.form.get('email', '') }}"
                 placeholder="020 xxxx xxxx ຫຼື name@example.com">
        </div>
      </div>

      <div class="field">
        <label for="password">ລະຫັດຜ່ານ</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password"
                 placeholder="ປ້ອນລະຫັດຜ່ານ">
          <button type="button" class="pw-toggle" id="togglePw" aria-label="ສະແດງລະຫັດຜ່ານ">
            <i class="fa-regular fa-eye" id="togglePwIcon"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" name="remember" value="1">
          <span>ຈື່ການເຂົ້າສູ່ລະບົບໄວ້</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>ເຂົ້າສູ່ລະບົບ</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>ຍັງບໍ່ມີບັນຊີ? <a href="{{ url_for('register') }}">ສະໝັກສະມາຊິກໃໝ່</a></p>
      <a href="{{ url_for('home') }}" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> ກັບຄືນໜ້າຫຼັກ
      </a>
    </div>
  </main>

  <script>
    (function () {
      var pw = document.getElementById('password');
      var btn = document.getElementById('togglePw');
      var icon = document.getElementById('togglePwIcon');
      if (btn && pw && icon) {
        btn.addEventListener('click', function () {
          var show = pw.type === 'password';
          pw.type = show ? 'text' : 'password';
          icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });
      }
      var idInput = document.getElementById('email');
      var idIcon = document.getElementById('identifierIcon');
      if (idInput && idIcon) {
        function updateIcon() {
          var v = idInput.value.trim();
          if (v.indexOf('@') !== -1 || /[a-zA-Z]/.test(v)) {
            idIcon.className = 'fa-solid fa-envelope';
          } else {
            idIcon.className = 'fa-solid fa-phone';
          }
        }
        idInput.addEventListener('input', updateIcon);
        updateIcon();
      }
    })();
  </script>
</body>

</html>
